inherits: b1_cosine_proto.yaml
experiment:
  name: b2_lora
  research_question: "Does limited late-block visual LoRA improve fine-grained adaptation without excessive drift?"
  tags: [mainline, lora]
model:
  lora:
    enabled: true
    target_blocks: [-4, -3, -2, -1]
    target_projections: [q, v]
    rank: 8
    alpha: 16
    dropout: 0.0

trainer:
  frozen_feature_cache:
    enabled: false
    directory: null
    verify_hashes: true
  reference_feature_cache:
    enabled: true
    directory: ${oc.env:NOISYCLIP_REFERENCE_FEATURE_CACHE}
    verify_hashes: true

evaluation:
  feature_drift_guard:
    enabled: true
    # Raw cosine thresholds. Diagnostic breaches warn; catastrophic breaches stop.
    minimum_cosine: 0.70
    maximum_epoch_drop: 0.06
    catastrophic_minimum_cosine: 0.0
    catastrophic_maximum_epoch_drop: 0.50
  lora_merge_atol: 0.00001
